<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      ?v= 는 캐시 무효화용이다. Chrome 은 favicon 을 일반 캐시가 아니라 origin 단위
      별도 DB 에 넣고 "아이콘 없음"이라는 실패까지 캐시한다. 한 번 그렇게 박히면
      새로고침으로는 다시 요청하지 않는다(배포 중 사이트가 잠깐 죽으면 이렇게 된다).
      아이콘을 바꿀 때는 이 숫자를 올린다.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/favicon.ico?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!--
      폰트 preload — 글씨가 한 번 바뀌어 보이는(FOUT) 문제를 줄인다.

      이게 없으면 브라우저가 CSS 를 받아 파싱하고 `@font-face` 를 만난 뒤에야
      폰트를 요청한다. 그 사이 폴백 폰트로 그려졌다가 나중에 교체되면서 깜빡인다.
      여기서 미리 걸어두면 CSS 와 **병렬로** 받는다.

      ⚠️ `crossorigin` 이 없으면 안 된다. 폰트는 CORS 모드로 요청되므로, 속성을
         빼면 preload 한 것과 CSS 가 요청하는 것이 서로 다른 요청으로 취급돼
         **두 번 받는다.** 같은 출처라도 마찬가지다.

      본문(Geist)과 로고·라벨(Geist Mono) 둘 다 첫 화면에 나오므로 같이 건다.
    -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="google-site-verification"
      content="SSOrBFGM1wDHl7KnX65LrsxSM-2acoSjtc_4mhsY-uM"
    />

    <!-- Primary Meta Tags -->
    <title>chatbase.kr — 5분이면 끝나는 AI 챗봇</title>
    <meta
      name="description"
      content="홈페이지에는 코드 한 줄, 매장에는 QR 한 장으로 내거는 AI 챗봇. 홈페이지가 없어도 되고, 외국인 손님에게는 한·영·일·중으로 답합니다. GPT 사용료는 저희가 부담해 API 키 없이 바로 시작하고, 내 키를 등록하면 모델 선택과 무제한 대화가 열립니다."
    />
    <meta
      name="keywords"
      content="AI 챗봇, 챗봇 임베드, QR 챗봇, 다국어 챗봇, 외국인 응대, 숙소 챗봇, 챗봇 SaaS, BYOK, GPT, Claude, Gemini, 고객지원 자동화, 한국 SaaS"
    />
    <meta name="author" content="chatbase.kr" />
    <link rel="canonical" href="https://chatbase.kr/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1c1c1c" />

    <!-- Open Graph / Facebook / KakaoTalk -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chatbase.kr/" />
    <meta property="og:title" content="chatbase.kr — 5분이면 끝나는 AI 챗봇" />
    <meta
      property="og:description"
      content="홈페이지에는 코드 한 줄, 매장에는 QR 한 장. 외국인 손님에게는 한·영·일·중으로 답합니다."
    />
    <!--
      파일명에 버전을 박아둔다. 카카오톡·페이스북은 OG 이미지를 오래 캐싱하고
      `?v=` 쿼리스트링을 무시하는 크롤러가 있어서, 그림을 바꿀 때는 **경로 자체**를
      바꿔야 확실하다(파비콘의 `?v=2` 와 다른 이유로 다른 방식을 쓴다).
      바꿀 때는 `scripts/og-image.mjs` 의 출력 경로와 아래 세 줄을 같이 고친다.

      width·height 를 같이 준다. 없으면 페이스북이 첫 크롤에서 크기를 모르는 채로
      카드를 만들어, 이미지가 한 박자 늦게 뜨거나 작은 썸네일로 떨어진다.
    -->
    <meta property="og:image" content="https://chatbase.kr/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="chatbase.kr" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="chatbase.kr" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chatbase.kr/" />
    <meta name="twitter:title" content="chatbase.kr — 5분이면 끝나는 AI 챗봇" />
    <meta
      name="twitter:description"
      content="홈페이지에는 코드 한 줄, 매장에는 QR 한 장. 외국인 손님에게는 한·영·일·중으로 답합니다."
    />
    <meta name="twitter:image" content="https://chatbase.kr/og-image-v2.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Google Analytics 4 -->
    <script>
      /*
       * /embed 에는 싣지 않는다.
       *
       * 그 경로는 **고객 사이트 안에서 도는 화면**이다(위젯 iframe · iframe 직접 삽입).
       * 여기에 우리 애널리틱스를 붙이면 남의 고객 방문자를 우리가 추적하는 게 되고,
       * 개인정보처리방침에 없는 일이다. suppress 가 아니라 **스크립트 자체를 안 받는다** —
       * 그래야 고객 사이트에서 구글로 나가는 요청이 아예 생기지 않는다.
       *
       * SPA 라우팅은 GA4 향상된 측정의 history 이벤트가 잡는다(기본 켜짐).
       */
      (function () {
        if (location.pathname.indexOf("/embed") === 0) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-QWJEXZL10M";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", "G-QWJEXZL10M");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
