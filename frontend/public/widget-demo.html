<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbase 위젯 데모</title>
    <style>
      body {
        margin: 0;
        padding: 80px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #171717;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        min-height: 100vh;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
      }
      p {
        color: #666;
        max-width: 480px;
        text-align: center;
        line-height: 1.6;
      }
      code {
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>가짜 외부 사이트</h1>
    <p>
      우측 하단의 채팅 버블이 chatbase.kr 위젯입니다. <br />
      <code>data-bot-id</code> 값을 자기 챗봇 ID로 바꾸면 자기 챗봇이 떠요.
    </p>
    <p>
      이 페이지를 다른 도메인/포트에서 열어 임베드 동작을 검증하면 됩니다.
    </p>

    <!-- 아래 한 줄이 임베드 코드. data-bot-id를 자기 봇 ID로 교체 -->
    <script src="/widget.js" data-bot-id="1" defer></script>
  </body>
</html>
