[project]
name = "chatbase-backend"
version = "0.1.0"
description = "Chatbase.kr — Korean chatbot embed SaaS backend (BYOK)"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "starlette>=1.0.0",
    # Database (MySQL)
    "sqlalchemy>=2.0.48",
    "asyncmy>=0.2.10",
    "alembic>=1.18.4",
    "greenlet>=3.3.2",
    # Validation / settings
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    # Auth
    "pyjwt>=2.12.1",
    "argon2-cffi>=25.1.0",
    "passlib>=1.7.4",
    # HTTP client
    "httpx>=0.28.1",
    # LLM SDKs (BYOK — provider keys are user-supplied at runtime)
    "openai>=2.29.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    # API key encryption
    "cryptography>=43.0.0",
    # Utility
    "pytz>=2026.1.post1",
    "google-genai>=1.74.0",
]

[tool.uv]
dev-dependencies = []
